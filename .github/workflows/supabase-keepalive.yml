name: Supabase keep-alive
# Pings the free Supabase project every 3 days so it isn't paused for inactivity.
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://tgjhyvcbkhowdipqlsge.supabase.co/rest/v1/rpc/get_schedule" \
            -H "apikey: sb_publishable_-7Mt7CEzVi8tcix62PLCrA_jwzbMmRz" \
            -H "Content-Type: application/json" \
            -d '{"p_id":"keepalive-ping","p_pass":"x"}')
          echo "Supabase responded $code"
          test "$code" = "200"
      # GitHub turns off scheduled workflows after 60 days with no commits,
      # so make a tiny commit every ~45 days to keep this running.
      - uses: actions/checkout@v4
      - name: Keep workflow enabled
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u > .github/keepalive.txt
            git config user.name "keepalive-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "keep-alive"
            git push
          fi
