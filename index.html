<script id="core">
// ---------- pure logic (tested in node) ----------
const DAY_MS=86400000;
function pad2(n){return String(n).padStart(2,"0");}
function isoDate(dt){return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate());}
function today(){return isoDate(new Date());}
function parseDate(dateStr){const [y,m,d]=String(dateStr).split("-").map(Number);return new Date(y,m-1,d);}
function addDays(dateStr,n){const dt=parseDate(dateStr);dt.setDate(dt.getDate()+n);return isoDate(dt);}
function startOfWeek(dateStr,weekStartsOn){weekStartsOn=weekStartsOn??0;const dt=parseDate(dateStr);const diff=(dt.getDay()-weekStartsOn+7)%7;dt.setDate(dt.getDate()-diff);return isoDate(dt);}
function weekDates(weekStart){return[0,1,2,3,4,5,6].map(i=>addDays(weekStart,i));}
function parseHHMM(s){if(s==null||s==="")return null;const m=/^(\d{1,2}):?(\d{2})(?::\d{2})?$/.exec(String(s).trim());if(!m)return null;const h=+m[1],min=+m[2];if(h>23||min>59)return null;return h*60+min;}
function fmtHHMM(mins,colon){mins=((mins%1440)+1440)%1440;const h=Math.floor(mins/60),m=mins%60;return pad2(h)+(colon===false?"":":")+pad2(m);}
function prettyTime(s){const n=typeof s==="number"?s:parseHHMM(s);return n==null?"":fmtHHMM(n,true);}
function shiftHours(start,end){const s=typeof start==="number"?start:parseHHMM(start);const e=typeof end==="number"?end:parseHHMM(end);if(s==null||e==null)return 0;let d=e-s;if(d<=0)d+=1440;return d/60;}
function shiftInterval(dateStr,start,end){const s=typeof start==="number"?start:parseHHMM(start);const e=typeof end==="number"?end:parseHHMM(end);if(s==null||e==null)return null;const[y,mo,d]=dateStr.split("-").map(Number);const startMs=Date.UTC(y,mo-1,d,Math.floor(s/60),s%60);let endMs=Date.UTC(y,mo-1,d,Math.floor(e/60),e%60);if(endMs<=startMs)endMs+=DAY_MS;return{start:startMs,end:endMs,hours:(endMs-startMs)/3600000};}
function overlaps(a,b){return a.start<b.end&&b.start<a.end;}
function restHours(earlier,later){return(later.start-earlier.end)/3600000;}
function fmtHours(h){if(h==null||isNaN(h))return"0";return String(Math.round(h*100)/100);}
function shortName(name){const p=String(name||"").trim().split(/\s+/).filter(Boolean);if(!p.length)return"—";return p.length>1?p[p.length-1]:p[0];}
function weekdayName(dateStr,kind){const dt=parseDate(dateStr);const i=dt.getDay();return(kind==="short"?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"])[i];}
function formatMD(dateStr){const dt=parseDate(dateStr);return(dt.getMonth()+1)+"/"+dt.getDate();}
function formatWeekLabel(weekStart){const a=parseDate(weekStart),end=parseDate(addDays(weekStart,6));const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  if(a.getMonth()===end.getMonth()&&a.getFullYear()===end.getFullYear())return months[a.getMonth()]+" "+a.getDate()+"–"+end.getDate()+", "+a.getFullYear();
  if(a.getFullYear()===end.getFullYear())return months[a.getMonth()]+" "+a.getDate()+" – "+months[end.getMonth()]+" "+end.getDate()+", "+a.getFullYear();
  return months[a.getMonth()]+" "+a.getDate()+", "+a.getFullYear()+" – "+months[end.getMonth()]+" "+end.getDate()+", "+end.getFullYear();}
function weekHours(shifts,employeeId,weekStart){const set=new Set(weekDates(weekStart));return shifts.filter(s=>s.employeeId===employeeId&&set.has(s.date)).reduce((sum,s)=>sum+shiftHours(s.start,s.end),0);}
function hoursByEmployee(shifts,employees,weekStart){return employees.map(e=>({employeeId:e.id,name:e.name,role:e.role,hours:weekHours(shifts,e.id,weekStart)}));}
function findConflicts(shifts,settings){
  const minRest=settings.minRestHours??8,maxWeek=settings.maxWeekHours??60,weekStart=settings.weekStart;
  const issues=[];const byEmp={};
  const padStart=weekStart?addDays(weekStart,-2):null,padEnd=weekStart?addDays(weekStart,8):null;
  for(const s of shifts){
    if(!s.employeeId)continue;
    if(weekStart&&(s.date<padStart||s.date>padEnd))continue;
    (byEmp[s.employeeId]||=[]).push(s);
  }
  for(const empId of Object.keys(byEmp)){
    const intervals=[];
    for(const s of byEmp[empId]){const iv=shiftInterval(s.date,s.start,s.end);if(iv)intervals.push({shift:s,...iv});}
    intervals.sort((a,b)=>a.start-b.start||a.end-b.end);
    for(let i=0;i<intervals.length;i++){
      for(let j=i+1;j<intervals.length;j++){
        if(intervals[j].start>=intervals[i].end)break;
        if(overlaps(intervals[i],intervals[j])){
          issues.push({type:"overlap",employeeId:empId,shiftIds:[intervals[i].shift.id,intervals[j].shift.id],dates:[intervals[i].shift.date,intervals[j].shift.date],hours:0,message:"Double-booked / overlapping shifts"});
        }
      }
    }
    const blocks=[];
    for(const iv of intervals){
      const last=blocks[blocks.length-1];
      if(last&&iv.start<last.end){last.end=Math.max(last.end,iv.end);last.shiftIds.push(iv.shift.id);}
      else blocks.push({start:iv.start,end:iv.end,shiftIds:[iv.shift.id],date:iv.shift.date});
    }
    for(let i=0;i<blocks.length-1;i++){
      const rest=restHours(blocks[i],blocks[i+1]);
      if(rest<minRest){
        issues.push({type:"rest",employeeId:empId,shiftIds:[blocks[i].shiftIds[blocks[i].shiftIds.length-1],blocks[i+1].shiftIds[0]],dates:[blocks[i].date,blocks[i+1].date],hours:rest,message:"Only "+fmtHours(rest)+"h rest (min "+fmtHours(minRest)+"h)"});
      }
    }
    if(weekStart){
      const hrs=weekHours(shifts,empId,weekStart);
      if(hrs>maxWeek)issues.push({type:"overhours",employeeId:empId,shiftIds:[],dates:[weekStart],hours:hrs,message:fmtHours(hrs)+"h this week (limit "+fmtHours(maxWeek)+"h)"});
    }
  }
  return issues;
}
function openShifts(shifts,weekStart){const set=new Set(weekDates(weekStart));return shifts.filter(s=>!s.employeeId&&set.has(s.date));}
let _seq=0;
function defaultId(){_seq++;return"id-"+_seq+"-"+Date.now().toString(36);}
function copyWeek(shifts,fromWeekStart,toWeekStart,newIdFn){const from=weekDates(fromWeekStart),to=weekDates(toWeekStart);const map=Object.fromEntries(from.map((d,i)=>[d,to[i]]));const nid=newIdFn||defaultId;return shifts.filter(s=>map[s.date]).map(s=>Object.assign({},s,{id:nid(),date:map[s.date],example:false}));}
function copyDay(shifts,fromDate,toDates,newIdFn){const nid=newIdFn||defaultId;const targets=Array.isArray(toDates)?toDates:[toDates];const src=shifts.filter(s=>s.date===fromDate);const out=[];for(const td of targets){if(td===fromDate)continue;for(const s of src)out.push(Object.assign({},s,{id:nid(),date:td,example:false}));}return out;}
function repeatShift(shift,extraDays,newIdFn){const nid=newIdFn||defaultId;const out=[];for(let i=1;i<=extraDays;i++)out.push(Object.assign({},shift,{id:nid(),date:addDays(shift.date,i),example:false}));return out;}
function formatEmployeeShare(emp,shifts,sites,templates,weekStart){
  const dates=weekDates(weekStart);
  const siteBy=Object.fromEntries((sites||[]).map(s=>[s.id,s]));
  const tplBy=Object.fromEntries((templates||[]).map(t=>[t.id,t]));
  const mine=shifts.filter(s=>s.employeeId===emp.id&&dates.includes(s.date));
  const lines=[(emp.name||"Staff")+(emp.role?" ("+emp.role+")":""),"CMD Health Partners — week of "+formatWeekLabel(weekStart),""];
  for(const d of dates){
    const dayShifts=mine.filter(s=>s.date===d).sort((a,b)=>(parseHHMM(a.start)||0)-(parseHHMM(b.start)||0));
    if(!dayShifts.length)lines.push(weekdayName(d,"short")+" "+formatMD(d)+"  Off");
    else for(const s of dayShifts){const tpl=s.templateId&&tplBy[s.templateId];const site=siteBy[s.siteId];const label=tpl?tpl.name:"Custom";
      lines.push(weekdayName(d,"short")+" "+formatMD(d)+"  "+label+" "+prettyTime(s.start)+"–"+prettyTime(s.end)+"  "+(site?site.name:"Unknown site")+"  ("+fmtHours(shiftHours(s.start,s.end))+"h)");}
  }
  lines.push("","Total: "+fmtHours(weekHours(shifts,emp.id,weekStart))+" hours");
  return lines.join("\n");
}
function csvEscape(s){s=String(s??"");return/[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function formatWeekCSV(shifts,employees,sites,templates,weekStart){
  const dates=weekDates(weekStart);
  const empBy=Object.fromEntries((employees||[]).map(e=>[e.id,e]));
  const siteBy=Object.fromEntries((sites||[]).map(s=>[s.id,s]));
  const tplBy=Object.fromEntries((templates||[]).map(t=>[t.id,t]));
  const header=["Date","Day","Site","Client","Shift","Start","End","Hours","Employee","Role","Phone"];
  const weekShifts=shifts.filter(s=>dates.includes(s.date)).slice().sort((a,b)=>{
    if(a.date!==b.date)return a.date<b.date?-1:1;
    const sa=parseHHMM(a.start)||0,sb=parseHHMM(b.start)||0;if(sa!==sb)return sa-sb;
    const na=(siteBy[a.siteId]||{}).name||"",nb=(siteBy[b.siteId]||{}).name||"";return na<nb?-1:na>nb?1:0;
  });
  const rows=[header.join(",")];
  for(const s of weekShifts){
    const emp=empBy[s.employeeId]||{},site=siteBy[s.siteId]||{},tpl=tplBy[s.templateId]||{};
    rows.push([s.date,weekdayName(s.date,"short"),site.name||"",site.client||"",tpl.name||"Custom",prettyTime(s.start),prettyTime(s.end),fmtHours(shiftHours(s.start,s.end)),emp.name||"OPEN",emp.role||"",emp.phone||""].map(csvEscape).join(","));
  }
  return rows.join("\n")+(rows.length?"\n":"");
}
if(typeof module!=="undefined")module.exports={isoDate,today,parseDate,addDays,startOfWeek,weekDates,parseHHMM,fmtHHMM,prettyTime,shiftHours,shiftInterval,overlaps,restHours,fmtHours,shortName,weekdayName,formatMD,formatWeekLabel,weekHours,hoursByEmployee,findConflicts,openShifts,copyWeek,copyDay,repeatShift,formatEmployeeShare,csvEscape,formatWeekCSV};

</script>

const DEFAULT_TPL=[

function safeColor(c){return/^#[0-9A-Fa-f]{3,8}$/.test(c||"")?c:"#44403c";}

function seedExamples(weekStart){
  const employees=[
    {id:"ex-e1",name:"Example – Jordan Hale",role:"Paramedic",phone:"",example:true},

    {id:"ex-s2",name:"Example – Gulf Coast Energy Yard",client:"Gulf Coast Energy",address:"",example:true},
    {id:"ex-s3",name:"Example – Permian Well Pad 12",client:"Permian Operating",address:"",example:true}
  ];
  const onWd=wd=>weekDates(weekStart).find(d=>parseDate(d).getDay()===wd);
  const mon=onWd(1),tue=onWd(2),wed=onWd(3),thu=onWd(4),fri=onWd(5),sat=onWd(6);
  const sh=(id,date,siteId,templateId,employeeId)=>({id,date,siteId,templateId,employeeId,start:DEFAULT_TPL.find(t=>t.id===templateId).start,end:DEFAULT_TPL.find(t=>t.id===templateId).end,example:true});
  const shifts=[];
  if(mon){shifts.push(sh("ex-sh1",mon,"ex-s1","t-day","ex-e1"));shifts.push(sh("ex-sh2",mon,"ex-s2","t-day","ex-e1"));}
  if(tue){shifts.push(sh("ex-sh3",tue,"ex-s1","t-day",null));shifts.push(sh("ex-sh4",tue,"ex-s3","t-night","ex-e3"));}
  if(wed)shifts.push(sh("ex-sh5",wed,"ex-s2","t-day","ex-e2"));
  if(thu)shifts.push(sh("ex-sh6",thu,"ex-s3","t-24","ex-e2"));
  if(fri)shifts.push(sh("ex-sh7",fri,"ex-s1","t-day","ex-e1"));
  if(sat)shifts.push(sh("ex-sh8",sat,"ex-s2","t-night","ex-e3"));
  return{employees,sites,shifts};
}

function emptyState(){
  const seed=seedExamples(startOfWeek(today(),0));
  return{employees:seed.employees,sites:seed.sites,templates:DEFAULT_TPL.map(t=>({...t})),shifts:seed.shifts,settings:{minRestHours:8,maxWeekHours:60,weekStartsOn:0,viewMode:"site"}};
}

function load(){
  try{
    const raw=localStorage.getItem(K);
    if(!raw)return emptyState();
    const d=JSON.parse(raw);
    if(!d||typeof d!=="object")return emptyState();
    d.employees=Array.isArray(d.employees)?d.employees:[];
    d.sites=Array.isArray(d.sites)?d.sites:[];
    d.templates=Array.isArray(d.templates)&&d.templates.length?d.templates:DEFAULT_TPL.map(t=>({...t}));
    d.shifts=Array.isArray(d.shifts)?d.shifts:[];
    d.settings=Object.assign({minRestHours:8,maxWeekHours:60,weekStartsOn:0,viewMode:"site"},d.settings||{});
    return d;
  }catch(e){return emptyState();}
}
function save(){localStorage.setItem(K,JSON.stringify(S));}

let S=load();
let UI={week:startOfWeek(today(),S.settings.weekStartsOn),mode:S.settings.viewMode||"site",tab:"week",sheet:null,toastT:null,copyFrom:null,roleFilt:"",empFilt:""};

function emp(id){return S.employees.find(e=>e.id===id);}
function site(id){return S.sites.find(s=>s.id===id);}
function tpl(id){return S.templates.find(t=>t.id===id);}
function hasExamples(){return S.employees.some(e=>e.example)||S.sites.some(s=>s.example)||S.shifts.some(s=>s.example);}
function clearExamples(){
  const exEmp=new Set(S.employees.filter(e=>e.example).map(e=>e.id));
  const exSite=new Set(S.sites.filter(s=>s.example).map(s=>s.id));
  S.employees=S.employees.filter(e=>!e.example);
  S.sites=S.sites.filter(s=>!s.example);
  S.shifts=S.shifts.filter(s=>!s.example&&!exEmp.has(s.employeeId)&&!exSite.has(s.siteId));
  save();toast("Example people and sites removed.");render();
}

function conflictsThisWeek(){return findConflicts(S.shifts,{minRestHours:+S.settings.minRestHours||8,maxWeekHours:+S.settings.maxWeekHours||60,weekStart:UI.week});}
function weekShifts(){const set=new Set(weekDates(UI.week));return S.shifts.filter(s=>set.has(s.date));}

function toast(msg){
  const el=$("toast");el.textContent=msg;el.classList.add("on");
  clearTimeout(UI.toastT);UI.toastT=setTimeout(()=>el.classList.remove("on"),2400);
}

function openSheet(html){
  $("sheetBody").innerHTML=html;$("mask").classList.add("on");$("sheet").classList.add("on");
  document.body.style.overflow="hidden";
}
function closeSheet(){
  $("mask").classList.remove("on");$("sheet").classList.remove("on");$("sheetBody").innerHTML="";

}

function colorDots(selected,name){
  return `<div class="dots">${COLORS.map(c=>`<button type="button" class="dot${c===selected?" on":""}" data-act="pick-color" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}<input type="hidden" name="${name||"color"}" id="fColor" value="${esc(selected||COLORS[0])}"></div>`;
}

// ----- render week -----
function renderWeek(){
  const dates=weekDates(UI.week);
  const todayStr=today();
  const conf=conflictsThisWeek();
  const confShift=new Set(conf.flatMap(c=>c.shiftIds||[]));
  const mode=UI.mode;
  const rows=mode==="site"?S.sites:S.employees;
  const open=openShifts(S.shifts,UI.week);
  let h=`<div class="toolbar no-print">
    <div class="row tight"><button class="s ico" data-act="prev-week" aria-label="Previous week">‹</button>
    <button class="s grow" data-act="this-week">${esc(formatWeekLabel(UI.week))}</button>
    <button class="s ico" data-act="next-week" aria-label="Next week">›</button></div>
    <div class="seg" role="tablist">
      <button class="${mode==="site"?"on":""}" data-act="mode" data-mode="site">By site</button>
      <button class="${mode==="employee"?"on":""}" data-act="mode" data-mode="employee">By person</button>
    </div>
    <div class="row tight"><button class="s" data-act="copy-last">Copy last week</button>
    <button class="s" data-act="clear-week">Clear week</button></div>
  </div>`;
  if(conf.length){
    h+=`<div class="banner warn no-print"><b>${conf.length} conflict${conf.length>1?"s":""} this week</b>
      <ul>${conf.map(c=>{const e=emp(c.employeeId);return `<li>${esc((e&&e.name)||"Staff")}: ${esc(c.message)}</li>`;}).join("")}</ul></div>`;
  }
  if(open.length)h+=`<div class="banner open no-print"><b>${open.length} open shift${open.length>1?"s":""}</b> — unfilled cells are highlighted.</div>`;
  if(!S.sites.length||!S.employees.length){
    h+=`<div class="card"><p>Add your staff and job sites in <button class="link" data-act="go" data-tab="setup">Setup</button>, then tap a cell to build the week. No typing once the lists are in.</p></div>`;
  }
  if(!rows.length){$("weekOut").innerHTML=h;return;}
  h+=`<p class="mut no-print swipe-hint">Swipe the board sideways to see the rest of the week.</p><div class="gridwrap"><div class="grid" style="--cols:${dates.length}">
    <div class="ghead sticky-col">${mode==="site"?"Site":"Staff"}</div>
    ${dates.map((d,i)=>`<div class="ghead ${d===todayStr?"today":""}" data-act="day-menu" data-date="${d}"><b>${weekdayName(d,"short")}</b><div class="mut">${formatMD(d)}</div></div>`).join("")}`;
  for(const row of rows){
    const label=mode==="site"?row.name:row.name;
    const sub=mode==="site"?(row.client||""):(row.role||"");
    const hours=mode==="employee"?weekHours(S.shifts,row.id,UI.week):null;
    const over=hours!=null&&hours>(+S.settings.maxWeekHours||60);
    h+=`<div class="gcell sticky-col rlab"><b class="clip">${esc(label)}</b>${sub?`<div class="mut clip">${esc(sub)}</div>`:""}${hours!=null?`<div class="hrs ${over?"bad":""}">${fmtHours(hours)}h</div>`:""}</div>`;
    for(const d of dates){
      const cellShifts=S.shifts.filter(s=>s.date===d&&(mode==="site"?s.siteId===row.id:s.employeeId===row.id))
        .sort((a,b)=>(parseHHMM(a.start)||0)-(parseHHMM(b.start)||0));
      const isOpen=cellShifts.some(s=>!s.employeeId);
      h+=`<div class="gcell tap ${d===todayStr?"today":""} ${isOpen?"has-open":""}" data-act="cell" data-mode="${mode}" data-id="${row.id}" data-date="${d}">`;
      if(!cellShifts.length)h+=`<span class="plus">+</span>`;
      for(const s of cellShifts){
        const t=tpl(s.templateId);const e=emp(s.employeeId);
        const color=(t&&t.color)||"#44403c";
        const name=mode==="site"?(e?shortName(e.name):"OPEN"):(site(s.siteId)?shortName(site(s.siteId).name):"?");
        const overEmp=conf.some(c=>c.type==="overhours"&&e&&c.employeeId===e.id);
        const warn=confShift.has(s.id)||overEmp;
        h+=`<div class="chip ${s.employeeId?"":"open"} ${warn?"bad":""}" style="--c:${safeColor(color)}"><span class="cn">${esc((t&&t.name)||"Custom")}</span> · ${esc(name)}</div>`;
      }
      h+=`</div>`;
    }
  }
  h+=`</div></div>`;
  const hours=hoursByEmployee(S.shifts,S.employees,UI.week);
  if(S.employees.length){
    h+=`<div class="hours-strip no-print">${hours.map(x=>{
      const over=x.hours>(+S.settings.maxWeekHours||60);
      const e=emp(x.employeeId);
      return `<span class="${over?"bad":""}">${esc(e?shortName(e.name):"?")} <b>${fmtHours(x.hours)}h</b></span>`;
    }).join("<span class='dotsep'>·</span>")}</div>`;
  }
  $("weekOut").innerHTML=h;
}

function cellShifts(mode,id,date){
  return S.shifts.filter(s=>s.date===date&&(mode==="site"?s.siteId===id:s.employeeId===id))
    .sort((a,b)=>(parseHHMM(a.start)||0)-(parseHHMM(b.start)||0));
}

  UI.sheet={type:"cell",mode,id,date};

function shiftForm(opts){
  const {mode,id,date,existing}=opts;
  const tpls=S.templates;
  const chosenTpl=existing?existing.templateId:(UI.sheet&&UI.sheet.templateId)||"";
  const chosenEmp=existing?existing.employeeId||"":(mode==="employee"?id:(UI.sheet&&UI.sheet.employeeId)||"");
  const chosenSite=existing?existing.siteId:(mode==="site"?id:(UI.sheet&&UI.sheet.siteId)||"");
  const start=existing?existing.start:((UI.sheet&&UI.sheet.start)||(chosenTpl&&tpl(chosenTpl)?tpl(chosenTpl).start:"06:00"));
  const end=existing?existing.end:((UI.sheet&&UI.sheet.end)||(chosenTpl&&tpl(chosenTpl)?tpl(chosenTpl).end:"18:00"));
  const isCustom=!chosenTpl||chosenTpl==="custom";
  const preview={employeeId:chosenEmp||null,start,end,date,id:existing?existing.id:"preview",siteId:chosenSite,templateId:chosenTpl&&chosenTpl!=="custom"?chosenTpl:null};
  const others=S.shifts.filter(s=>!existing||s.id!==existing.id);
  const live=chosenEmp?findConflicts(others.concat(preview),{minRestHours:+S.settings.minRestHours||8,maxWeekHours:+S.settings.maxWeekHours||60,weekStart:UI.week}):[];
  let h=`<div class="sheet-h"><h2>${existing?"Edit shift":"Add shift"}</h2><button class="x" data-act="back-cell" aria-label="Back">✕</button></div>
    <p class="mut">${esc(weekdayName(date,"short")+" "+formatMD(date))}${mode==="site"&&site(id)? " · "+esc(site(id).name):""}${mode==="employee"&&emp(id)? " · "+esc(emp(id).name):""}</p>`;
  if(mode==="employee"||(existing&&!mode)){
    /* site picker when adding from employee view */
  }
  if(mode==="employee"){
    h+=`<label>Job site</label><div class="pick-list">`;
    for(const si of S.sites){
      h+=`<button type="button" class="pick ${si.id===chosenSite?"on":""}" data-act="form-site" data-id="${si.id}"><b>${esc(si.name)}</b>${si.client?`<span class="mut">${esc(si.client)}</span>`:""}</button>`;
    }
    if(!S.sites.length)h+=`<p class="mut">Add a job site in Setup first.</p>`;
    h+=`</div>`;
  }
  h+=`<label>Shift type</label><div class="pick-list">`;
  for(const t of tpls){
    h+=`<button type="button" class="pick ${t.id===chosenTpl?"on":""}" data-act="form-tpl" data-id="${t.id}"><span class="swatch" style="background:${safeColor(t.color)}"></span><b>${esc(t.name)}</b> <span class="mut">${prettyTime(t.start)}–${prettyTime(t.end)} · ${fmtHours(shiftHours(t.start,t.end))}h</span></button>`;
  }
  h+=`<button type="button" class="pick ${isCustom?"on":""}" data-act="form-tpl" data-id="custom"><span class="swatch" style="background:#44403c"></span><b>Custom times</b></button></div>`;
  h+=`<div class="row ${isCustom?"":"hide"}" id="customTimes"><div><label>Start</label><input type="time" id="fStart" value="${esc(start)}"></div><div><label>End</label><input type="time" id="fEnd" value="${esc(end)}"></div></div>
    <p class="mut ${isCustom?"":"hide"}" id="customHint">If end is earlier than or the same as start, the shift runs overnight (or 24 hours).</p>`;
  if(mode==="site"){
    const roles=[...new Set(S.employees.map(e=>e.role).filter(Boolean))];
    h+=`<label>Who’s working</label>`;
    if(S.employees.length>8)h+=`<input id="empFilt" placeholder="Filter names" value="${esc(UI.empFilt||"")}">`;
    if(roles.length>1)h+=`<div class="chips-row"><button type="button" class="mini ${!UI.roleFilt?"on":""}" data-act="role-filt" data-role="">All</button>${roles.map(r=>`<button type="button" class="mini ${UI.roleFilt===r?"on":""}" data-act="role-filt" data-role="${esc(r)}">${esc(r)}</button>`).join("")}</div>`;
    h+=`<div class="pick-list">`;
    h+=`<button type="button" class="pick ${!chosenEmp?"on":""}" data-act="form-emp" data-id=""><b>Leave open</b><span class="mut">Unfilled — highlight on the board</span></button>`;
    const filt=(UI.empFilt||"").toLowerCase();
    for(const e of S.employees){
      if(UI.roleFilt&&e.role!==UI.roleFilt)continue;
      if(filt&&!(e.name||"").toLowerCase().includes(filt))continue;
      const hrs=weekHours(others.concat(preview.employeeId===e.id?preview:[]),e.id,UI.week);
      const issues=findConflicts(others.concat({...preview,employeeId:e.id}),{minRestHours:+S.settings.minRestHours||8,maxWeekHours:+S.settings.maxWeekHours||60,weekStart:UI.week}).filter(c=>c.employeeId===e.id);
      h+=`<button type="button" class="pick ${chosenEmp===e.id?"on":""}" data-act="form-emp" data-id="${e.id}"><b>${esc(e.name)}</b><span class="mut">${esc(e.role||"")}${hrs? " · "+fmtHours(hrs)+"h this week":""}</span>${issues.length?`<span class="warn-inline">${esc(issues[0].message)}</span>`:""}</button>`;

    h+=`<label>Repeat for</label><div class="chips-row">`;
    const extra=(UI.sheet&&UI.sheet.extra)||0;

    h+=`<label>Also fill the next</label><div class="chips-row">`;
    for(const n of[0,1,2,3,4,5,6])h+=`<button type="button" class="mini ${(UI.sheet&&UI.sheet.extra||0)===n?"on":""}" data-act="form-extra" data-n="${n}">${n===0?"No":n+" day"+(n>1?"s":"")}</button>`;
    h+=`</div>`;
  }
  h+=`<button data-act="save-shift">${existing?"Save changes":"Save shift"}</button>`;
  if(existing)h+=`<button class="danger s" data-act="delete-shift" data-sid="${existing.id}">Delete shift</button>`;
  openSheet(h);
  const st=$("fStart"),en=$("fEnd");
  if(st)st.addEventListener("change",()=>{if(UI.sheet){UI.sheet.start=st.value;refreshForm();}});
  if(en)en.addEventListener("change",()=>{if(UI.sheet){UI.sheet.end=en.value;refreshForm();}});
  const filtEl=$("empFilt");
  if(filtEl)filtEl.addEventListener("input",()=>{const pos=filtEl.selectionStart;UI.empFilt=filtEl.value;refreshForm();const el=$("empFilt");if(el){el.focus();if(pos!=null)el.setSelectionRange(pos,pos);}});
}

  }

    siteId:UI.sheet.siteId||existing.siteId,
    start:UI.sheet.start||existing.start,
    end:UI.sheet.end||existing.end
  }):null});

function beginAdd(mode,id,date){
  UI.sheet={type:"add",mode,id,date,templateId:S.templates[0]?S.templates[0].id:"",employeeId:mode==="employee"?id:"",siteId:mode==="site"?id:"",extra:0};

function beginEdit(sid){

  const id=mode==="site"?s.siteId:s.employeeId;
  UI.sheet={type:"edit",mode,id,date:s.date,sid:s.id,templateId:s.templateId||"custom",employeeId:s.employeeId||"",siteId:s.siteId,start:s.start,end:s.end,extra:0};

function currentFormTimes(){
  const tId=UI.sheet&&UI.sheet.templateId;
  if(tId&&tId!=="custom"&&tpl(tId)){const t=tpl(tId);return{start:t.start,end:t.end,templateId:t.id};}
  const st=($("fStart")&&$("fStart").value)||(UI.sheet&&UI.sheet.start)||"06:00";
  const en=($("fEnd")&&$("fEnd").value)||(UI.sheet&&UI.sheet.end)||"18:00";
  return{start:prettyTime(st)||st,end:prettyTime(en)||en,templateId:null};

function saveShiftFromForm(){
  if(!UI.sheet)return;
  const times=currentFormTimes();
  if(parseHHMM(times.start)==null||parseHHMM(times.end)==null){toast("Check the start and end times.");return;}
  const mode=UI.sheet.mode;
  let siteId=mode==="site"?UI.sheet.id:(UI.sheet.siteId||"");
  let employeeId=mode==="employee"?UI.sheet.id:(UI.sheet.employeeId||"");
  if(UI.sheet.type==="edit"){
    const s=S.shifts.find(x=>x.id===UI.sheet.sid);
    if(s){siteId=UI.sheet.siteId||s.siteId;if(mode==="employee")employeeId=s.employeeId;}
  }
  if(!siteId){toast("Pick a job site.");return;}
  const extra=+((UI.sheet&&UI.sheet.extra)||0);
  const base={
    date:UI.sheet.date,siteId,templateId:times.templateId,employeeId:employeeId||null,
    start:times.start,end:times.end,example:false
  };
  if(UI.sheet.type==="edit"){
    const s=S.shifts.find(x=>x.id===UI.sheet.sid);
    if(!s)return;
    Object.assign(s,base);
    if(extra>0)S.shifts.push(...repeatShift(s,extra,uid));
  }else{
    const s=Object.assign({id:uid()},base);
    S.shifts.push(s);
    if(extra>0)S.shifts.push(...repeatShift(s,extra,uid));
  }
  save();closeSheet();render();
  toast(extra>0?`Saved, and filled ${extra} more day${extra>1?"s":""}.`:"Shift saved.");
}

}

function showCopyDay(fromDate){
  const targets=(UI.sheet&&UI.sheet.type==="copyDay"&&UI.sheet.targets)||[];
  UI.copyFrom=fromDate;
  UI.sheet={type:"copyDay",date:fromDate,targets};
  const dates=weekDates(UI.week);
  const n=S.shifts.filter(s=>s.date===fromDate).length;
  let h=`<div class="sheet-h"><h2>Copy ${esc(weekdayName(fromDate,"short"))} ${esc(formatMD(fromDate))}</h2><button class="x" data-act="close">✕</button></div>
    <p class="mut">${n} shift${n===1?"":"s"} — tap one or more days to paste onto.</p>
    <div class="pick-list">`;
  for(const d of dates){
    if(d===fromDate)continue;
    h+=`<button type="button" class="pick ${(UI.sheet.targets||[]).includes(d)?"on":""}" data-act="copy-target" data-date="${d}"><b>${esc(weekdayName(d,"long"))}</b> <span class="mut">${esc(formatMD(d))}</span></button>`;
  }
  h+=`</div><button data-act="copy-day-go">Copy to selected days</button>`;
  openSheet(h);
}

function renderToday(){
  const d=today();
  const list=S.shifts.filter(s=>s.date===d).sort((a,b)=>{
    const sa=parseHHMM(a.start)||0,sb=parseHHMM(b.start)||0;if(sa!==sb)return sa-sb;
    const na=(site(a.siteId)||{}).name||"";const nb=(site(b.siteId)||{}).name||"";return na<nb?-1:na>nb?1:0;
  });
  const conf=findConflicts(S.shifts,{minRestHours:+S.settings.minRestHours||8,maxWeekHours:+S.settings.maxWeekHours||60,weekStart:startOfWeek(d,S.settings.weekStartsOn)});
  const confShift=new Set(conf.filter(c=>(c.dates||[]).includes(d)).flatMap(c=>c.shiftIds||[]));
  let h=`<div class="card"><h2>Today · ${esc(weekdayName(d,"long"))} ${esc(formatMD(d))}</h2>
    <p class="mut">${list.length} shift${list.length===1?"":"s"} · ${list.filter(s=>!s.employeeId).length} open</p></div>`;
  if(!S.sites.length){h+=`<div class="card"><p>Add job sites in Setup to start scheduling.</p></div>`;$("todayOut").innerHTML=h;return;}
  if(!list.length)h+=`<div class="card"><p class="mut">Nothing scheduled today. Jump to the <button class="link" data-act="go" data-tab="week">week board</button> to add shifts.</p></div>`;
  const bySite={};
  for(const si of S.sites)bySite[si.id]=[];
  for(const s of list)(bySite[s.siteId]||=[]).push(s);
  for(const si of S.sites){
    const items=bySite[si.id]||[];
    h+=`<div class="card"><h3>${esc(si.name)}</h3>${si.client?`<p class="mut">${esc(si.client)}</p>`:""}`;
    if(!items.length)h+=`<p class="mut">No coverage today.</p><button class="s" data-act="cell" data-mode="site" data-id="${si.id}" data-date="${d}">+ Add a shift</button>`;
    for(const s of items){
      const t=tpl(s.templateId),e=emp(s.employeeId);
      const color=(t&&t.color)||"#44403c";
      h+=`<button class="card-btn" data-act="edit-shift" data-sid="${s.id}">
        <div class="chip ${s.employeeId?"":"open"} ${confShift.has(s.id)?"bad":""}" style="--c:${safeColor(color)}">${esc((t&&t.name)||"Custom")}<div>${prettyTime(s.start)}–${prettyTime(s.end)}</div></div>
        <div><b>${esc(e?e.name:"OPEN — unfilled")}</b><div class="mut">${esc(e&&e.role||"")} · ${fmtHours(shiftHours(s.start,s.end))}h</div></div></button>`;
    }
    h+=`</div>`;
  }
  $("todayOut").innerHTML=h;
}

function renderHours(){
  const max=+S.settings.maxWeekHours||60;
  const hours=hoursByEmployee(S.shifts,S.employees,UI.week).sort((a,b)=>b.hours-a.hours);
  const conf=conflictsThisWeek();
  let h=`<div class="card"><h2>Hours · ${esc(formatWeekLabel(UI.week))}</h2>
    <p class="mut">Limit is ${fmtHours(max)} hours (change it in Setup). Tap a name to text them this week’s shifts.</p></div>`;
  if(!S.employees.length)h+=`<div class="card"><p class="mut">No staff yet.</p></div>`;
  for(const x of hours){
    const e=emp(x.employeeId);if(!e)continue;
    const pct=Math.min(100,max? (x.hours/max)*100:0);
    const over=x.hours>max;
    const issues=conf.filter(c=>c.employeeId===e.id);
    h+=`<div class="card emp-card"><div class="row-between"><div><b>${esc(e.name)}</b><div class="mut">${esc(e.role||"")}</div></div><div class="big ${over?"bad":""}">${fmtHours(x.hours)}<span class="mut">h</span></div></div>
      <div class="bar"><div class="bar-in ${over?"bad":""}" style="width:${pct}%"></div></div>
      ${issues.length?`<div class="banner warn">${issues.map(i=>esc(i.message)).join(" · ")}</div>`:""}
      <div class="row tight"><button class="s" data-act="share-emp" data-id="${e.id}">Share / text this week</button>
      ${e.phone?`<button class="s" data-act="sms-emp" data-id="${e.id}">Open Messages</button>`:""}</div></div>`;
  }
  const opens=openShifts(S.shifts,UI.week);
  if(opens.length){
    h+=`<div class="card"><h3>Open shifts</h3><ul class="plain">`;
    for(const s of opens){const si=site(s.siteId),t=tpl(s.templateId);
      h+=`<li>${esc(weekdayName(s.date,"short"))} ${esc(formatMD(s.date))} · ${esc((t&&t.name)||"Custom")} ${prettyTime(s.start)}–${prettyTime(s.end)} · ${esc(si?si.name:"?")}</li>`;}
    h+=`</ul></div>`;
  }
  $("hoursOut").innerHTML=h;
}

function printWeek(){
  const dates=weekDates(UI.week);
  const conf=conflictsThisWeek();
  let h=`<h1>CMD Health Partners — Onsite Schedule</h1>
    <p class="print-sub">Week of ${esc(formatWeekLabel(UI.week))} · Prepared for field staffing</p>
    <table class="pt"><thead><tr><th>Site</th>${dates.map(d=>`<th>${esc(weekdayName(d,"short"))}<br>${esc(formatMD(d))}</th>`).join("")}</tr></thead><tbody>`;
  for(const si of S.sites){
    h+=`<tr><td><b>${esc(si.name)}</b>${si.client?`<div class="mut">${esc(si.client)}</div>`:""}</td>`;
    for(const d of dates){
      const list=S.shifts.filter(s=>s.date===d&&s.siteId===si.id).sort((a,b)=>(parseHHMM(a.start)||0)-(parseHHMM(b.start)||0));
      h+=`<td>${list.map(s=>{const t=tpl(s.templateId),e=emp(s.employeeId);const color=(t&&t.color)||"#444";
        return `<div class="pchip" style="border-left-color:${safeColor(color)}"><b>${esc((t&&t.name)||"Custom")}</b> ${prettyTime(s.start)}–${prettyTime(s.end)}<br>${esc(e?e.name:"OPEN")}${e&&e.role?" · "+esc(e.role):""}</div>`;}).join("")||"&nbsp;"}</td>`;
    }
    h+=`</tr>`;
  }
  h+=`</tbody></table>`;
  h+=`<h2>Hours</h2><table class="pt tight"><thead><tr><th>Staff</th><th>Role</th><th>Hours</th></tr></thead><tbody>`;
  for(const x of hoursByEmployee(S.shifts,S.employees,UI.week)){
    const e=emp(x.employeeId);if(!e)continue;
    h+=`<tr><td>${esc(e.name)}</td><td>${esc(e.role||"")}</td><td>${fmtHours(x.hours)}${x.hours>(+S.settings.maxWeekHours||60)?" (over cap)":""}</td></tr>`;
  }
  h+=`</tbody></table>`;
  const opens=openShifts(S.shifts,UI.week);
  if(opens.length){h+=`<h2>Open shifts</h2><ul>`;for(const s of opens){const si=site(s.siteId),t=tpl(s.templateId);h+=`<li>${esc(weekdayName(s.date,"short"))} ${esc(formatMD(s.date))} · ${esc((t&&t.name)||"Custom")} · ${esc(si?si.name:"")}</li>`;}h+=`</ul>`;}
  if(conf.length){h+=`<h2>Conflicts</h2><ul>`;for(const c of conf){const e=emp(c.employeeId);h+=`<li>${esc(e?e.name:"Staff")}: ${esc(c.message)}</li>`;}h+=`</ul>`;}
  $("printArea").innerHTML=h;
  document.body.classList.add("printing");
  const after=()=>{document.body.classList.remove("printing");window.removeEventListener("afterprint",after);};
  window.addEventListener("afterprint",after);
  window.print();
}

async function shareText(title,text){
  if(navigator.share){
    try{await navigator.share({title,text});return;}catch(err){if(err&&err.name==="AbortError")return;}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{await navigator.clipboard.writeText(text);toast("Copied. Paste it into a text message.");return;}catch(e){}
  }
  prompt("Copy this:",text);
}

function shareEmp(id,sms){
  const e=emp(id);if(!e)return;
  const text=formatEmployeeShare(e,S.shifts,S.sites,S.templates,UI.week);
  if(sms&&e.phone){
    const num=String(e.phone).replace(/[^\d+]/g,"");
    const body=encodeURIComponent(text);
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
    location.href=ios?`sms:${num}&body=${body}`:`sms:${num}?body=${body}`;
    return;
  }
  shareText(e.name+" — week of "+formatWeekLabel(UI.week),text);
}

function downloadCSV(){
  const csv=formatWeekCSV(S.shifts,S.employees,S.sites,S.templates,UI.week);
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="CMD-schedule-"+UI.week+".csv";
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast("CSV ready. If it didn’t download, try Share from the Files preview.");
}

function exportJSON(){
  const j=JSON.stringify(S);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(j).then(()=>toast("Backup copied. Paste it in Notes or email it to yourself."),()=>prompt("Copy this backup:",j));
  }else prompt("Copy this backup:",j);
}
function importJSON(){
  const j=prompt("Paste your backup JSON:");
  if(!j)return;
  try{
    const d=JSON.parse(j);
    if(!d||!Array.isArray(d.employees)||!Array.isArray(d.sites)||!Array.isArray(d.shifts))throw new Error("shape");
    S=d;
    S.templates=Array.isArray(S.templates)&&S.templates.length?S.templates:DEFAULT_TPL.map(t=>({...t}));
    S.settings=Object.assign({minRestHours:8,maxWeekHours:60,weekStartsOn:0,viewMode:"site"},S.settings||{});
    UI.week=startOfWeek(today(),S.settings.weekStartsOn);
    UI.mode=S.settings.viewMode||"site";
    save();render();toast("Backup restored.");
  }catch(e){alert("That didn’t look like a valid backup.");}
}

function goTab(tab){
  UI.tab=tab;
  document.querySelectorAll("nav button,.sec").forEach(x=>x.classList.remove("on"));
  const btn=document.querySelector(`nav button[data-s="${tab}"]`);
  if(btn)btn.classList.add("on");
  const sec=$("s-"+tab);if(sec)sec.classList.add("on");
  window.scrollTo(0,0);
  render();
}

function render(){
  $("hdr").textContent=formatWeekLabel(UI.week);
  if(UI.tab==="week")renderWeek();
  if(UI.tab==="today")renderToday();
  if(UI.tab==="hours")renderHours();
  if(UI.tab==="setup")renderSetup();
  if(UI.tab==="export")renderExport();
}

document.addEventListener("click",ev=>{
  const btn=ev.target.closest("[data-act]");if(!btn)return;
  const act=btn.dataset.act;
  if(act==="close"){closeSheet();return;}
  if(act==="go"){closeSheet();goTab(btn.dataset.tab);return;}
  if(act==="prev-week"){UI.week=addDays(UI.week,-7);render();return;}
  if(act==="next-week"){UI.week=addDays(UI.week,7);render();return;}
  if(act==="this-week"){UI.week=startOfWeek(today(),S.settings.weekStartsOn);render();return;}
  if(act==="mode"){UI.mode=btn.dataset.mode;S.settings.viewMode=UI.mode;save();render();return;}
  if(act==="cell"){showCell(btn.dataset.mode,btn.dataset.id,btn.dataset.date);return;}
  if(act==="day-menu"){showDayMenu(btn.dataset.date);return;}
  if(act==="add-shift"){beginAdd(btn.dataset.mode,btn.dataset.id,btn.dataset.date);return;}
  if(act==="edit-shift"){beginEdit(btn.dataset.sid);return;}
  if(act==="back-cell"){
    if(UI.sheet)showCell(UI.sheet.mode,UI.sheet.id,UI.sheet.date);
    else closeSheet();
    return;
  }
  if(act==="form-tpl"){
    UI.sheet.templateId=btn.dataset.id;
    if(btn.dataset.id!=="custom"&&tpl(btn.dataset.id)){UI.sheet.start=tpl(btn.dataset.id).start;UI.sheet.end=tpl(btn.dataset.id).end;}
    refreshForm();return;
  }
  if(act==="form-emp"){UI.sheet.employeeId=btn.dataset.id;refreshForm();return;}
  if(act==="form-site"){UI.sheet.siteId=btn.dataset.id;refreshForm();return;}
  if(act==="form-extra"){UI.sheet.extra=+btn.dataset.n||0;refreshForm();return;}
  if(act==="role-filt"){UI.roleFilt=btn.dataset.role||"";refreshForm();return;}
  if(act==="save-shift"){saveShiftFromForm();return;}
  if(act==="delete-shift"){
    if(!confirm("Delete this shift?"))return;
    S.shifts=S.shifts.filter(s=>s.id!==btn.dataset.sid);save();closeSheet();render();toast("Shift deleted.");return;
  }
  if(act==="copy-last"){
    const from=addDays(UI.week,-7);
    const copies=copyWeek(S.shifts,from,UI.week,uid);
    if(!copies.length){toast("No shifts last week to copy.");return;}
    const existing=weekShifts().length;
    if(existing&&!confirm("Copy "+copies.length+" shift"+(copies.length===1?"":"s")+" from last week onto this week"+(existing?" (this week already has "+existing+")":"")+"?"))return;
    if(!existing&&!confirm("Copy "+copies.length+" shift"+(copies.length===1?"":"s")+" from last week onto this week?"))return;
    S.shifts.push(...copies);save();render();toast("Copied "+copies.length+" shift"+(copies.length===1?"":"s")+" from last week.");return;
  }
  if(act==="clear-week"){
    const n=weekShifts().length;if(!n){toast("This week is already empty.");return;}
    if(!confirm("Remove all "+n+" shift"+(n===1?"":"s")+" from this week?"))return;
    const set=new Set(weekDates(UI.week));S.shifts=S.shifts.filter(s=>!set.has(s.date));save();render();toast("Week cleared.");return;
  }
  if(act==="clear-day"){
    const date=btn.dataset.date;const n=S.shifts.filter(s=>s.date===date).length;
    if(!n){toast("Nothing to clear that day.");return;}
    if(!confirm("Remove "+n+" shift"+(n===1?"":"s")+" on "+weekdayName(date,"short")+"?"))return;
    S.shifts=S.shifts.filter(s=>s.date!==date);save();closeSheet();render();toast("Day cleared.");return;
  }
  if(act==="copy-day-start"){showCopyDay(btn.dataset.date);return;}
  if(act==="copy-target"){
    UI.sheet.targets=UI.sheet.targets||[];
    const d=btn.dataset.date;
    if(UI.sheet.targets.includes(d))UI.sheet.targets=UI.sheet.targets.filter(x=>x!==d);
    else UI.sheet.targets.push(d);
    showCopyDay(UI.sheet.date);return;
  }
  if(act==="copy-day-go"){
    const targets=UI.sheet&&UI.sheet.targets||[];
    if(!targets.length){toast("Tap at least one day to copy to.");return;}
    const copies=copyDay(S.shifts,UI.copyFrom||UI.sheet.date,targets,uid);
    if(!copies.length){toast("No shifts on the source day.");return;}
    S.shifts.push(...copies);save();closeSheet();render();toast("Copied to "+targets.length+" day"+(targets.length>1?"s":"")+".");return;
  }
  if(act==="clear-examples"){if(!confirm("Remove all example employees, sites, and their shifts? Your own data stays."))return;clearExamples();return;}
  if(act==="add-emp"){empForm(null);return;}
  if(act==="edit-emp"){empForm(emp(btn.dataset.id));return;}
  if(act==="save-emp"){
    const name=($("fName")&&$("fName").value||"").trim();if(!name){toast("Enter a name.");return;}
    const role=$("fRole")?$("fRole").value:"Paramedic";
    const phone=$("fPhone")?$("fPhone").value.trim():"";
    if(btn.dataset.id){const e=emp(btn.dataset.id);if(e){e.name=name;e.role=role;e.phone=phone;e.example=false;}}
    else S.employees.push({id:uid(),name,role,phone,example:false});
    save();closeSheet();render();toast("Employee saved.");return;
  }
  if(act==="delete-emp"){
    const id=btn.dataset.id;const n=S.shifts.filter(s=>s.employeeId===id).length;
    if(!confirm("Remove this employee"+(n?" and leave "+n+" shift"+(n===1?"":"s")+" open":"")+"?"))return;
    S.employees=S.employees.filter(e=>e.id!==id);
    S.shifts.forEach(s=>{if(s.employeeId===id)s.employeeId=null;});
    save();closeSheet();render();toast("Employee removed.");return;
  }
  if(act==="add-site"){siteForm(null);return;}
  if(act==="edit-site"){siteForm(site(btn.dataset.id));return;}
  if(act==="save-site"){
    const name=($("fName")&&$("fName").value||"").trim();if(!name){toast("Enter a site name.");return;}
    const client=$("fClient")?$("fClient").value.trim():"";
    const address=$("fAddr")?$("fAddr").value.trim():"";
    if(btn.dataset.id){const s=site(btn.dataset.id);if(s){s.name=name;s.client=client;s.address=address;s.example=false;}}
    else S.sites.push({id:uid(),name,client,address,example:false});
    save();closeSheet();render();toast("Site saved.");return;
  }
  if(act==="delete-site"){
    const id=btn.dataset.id;const n=S.shifts.filter(s=>s.siteId===id).length;
    if(!confirm("Remove this site"+(n?" and its "+n+" shift"+(n===1?"":"s"):"")+"?"))return;
    S.sites=S.sites.filter(s=>s.id!==id);
    S.shifts=S.shifts.filter(s=>s.siteId!==id);
    save();closeSheet();render();toast("Site removed.");return;
  }
  if(act==="add-tpl"){tplForm(null);return;}
  if(act==="edit-tpl"){tplForm(tpl(btn.dataset.id));return;}
  if(act==="pick-color"){const inp=$("fColor");if(inp)inp.value=btn.dataset.c;if(UI.sheet)UI.sheet.color=btn.dataset.c;document.querySelectorAll(".dot").forEach(d=>d.classList.toggle("on",d.dataset.c===btn.dataset.c));return;}
  if(act==="save-tpl"){
    const name=($("fName")&&$("fName").value||"").trim();if(!name){toast("Enter a template name.");return;}
    const start=$("fStart")?$("fStart").value:"06:00";const end=$("fEnd")?$("fEnd").value:"18:00";
    if(parseHHMM(start)==null||parseHHMM(end)==null){toast("Check the times.");return;}
    const color=($("fColor")&&$("fColor").value)||(UI.sheet&&UI.sheet.color)||COLORS[0];
    if(btn.dataset.id){const t=tpl(btn.dataset.id);if(t){t.name=name;t.start=start;t.end=end;t.color=color;}}
    else S.templates.push({id:uid(),name,start,end,color});
    save();closeSheet();render();toast("Template saved.");return;
  }
  if(act==="delete-tpl"){
    if(S.templates.length<=1){toast("Keep at least one template.");return;}
    if(!confirm("Remove this template? Existing shifts keep their times."))return;
    S.templates=S.templates.filter(t=>t.id!==btn.dataset.id);
    save();closeSheet();render();toast("Template removed.");return;
  }
  if(act==="week-start"){
    const n=+btn.dataset.n;const todayIn=today();
    S.settings.weekStartsOn=n;UI.week=startOfWeek(todayIn,n);save();render();return;
  }
  if(act==="share-emp"){shareEmp(btn.dataset.id,false);return;}
  if(act==="sms-emp"){shareEmp(btn.dataset.id,true);return;}
  if(act==="print-week"){printWeek();return;}
  if(act==="csv-week"){downloadCSV();return;}
  if(act==="export-json"){exportJSON();return;}
  if(act==="import-json"){importJSON();return;}
});

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>goTab(b.dataset.s)));
$("mask").addEventListener("click",closeSheet);

const icon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0f3d4c"/><text x="256" y="320" font-size="200" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">CMD</text></svg>');
$("mf").href=URL.createObjectURL(new Blob([JSON.stringify({name:"CMD Onsite Schedule",short_name:"CMD Schedule",start_url:location.href.split("#")[0],display:"standalone",background_color:"#f4f6f6",theme_color:"#0f3d4c",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]})],{type:"application/manifest+json"}));
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();

</script></body></html>
